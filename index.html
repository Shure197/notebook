<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>Notizblock</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#1c1c1e;--label2:#6c6c70;--fill:#e9e9ee;--tint:#007aff;--red:#ff3b30;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--label:#fff;--label2:#98989f;--fill:#2c2c2e;--tint:#0a84ff;--red:#ff453a;color-scheme:dark}}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font:17px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px;box-sizing:border-box}
form{background:var(--card);border-radius:20px;padding:32px 28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.ic{width:64px;height:64px;border-radius:16px;background:var(--tint);display:grid;place-items:center;color:#fff}
h1{margin:4px 0 0;font-size:22px;font-weight:600}
p{margin:0;color:var(--label2);font-size:15px;text-align:center}
input{width:100%;box-sizing:border-box;font:17px inherit;font-family:inherit;padding:12px 14px;border-radius:12px;border:0;background:var(--fill);color:var(--label);outline:none}
input:focus-visible{outline:2px solid var(--tint)}
button{width:100%;height:50px;border:0;border-radius:12px;background:var(--tint);color:#fff;font:600 17px inherit;font-family:inherit}
button:disabled{opacity:.6}
.err{color:var(--red);font-size:15px;min-height:20px}
</style></head><body>
<form id="f" hidden autocomplete="on">

<input type="text" name="username" value="Notizblock" autocomplete="username" hidden>
<input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort">
<button id="go" type="submit">Öffnen</button><div class="err" id="err" role="alert"></div>
</form>

function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function b64(a){var s="";new Uint8Array(a).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)}
function show(html){document.open();document.write(html);document.close()}
function dec(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT)).then(function(b){return new TextDecoder().decode(b)})}
function derive(pw){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},k,{name:"AES-GCM",length:256},true,["decrypt"])})}
